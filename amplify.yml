version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "MONGODB_URI=$MONGODB_URI" >> .env.production
        - nvm use 20
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - env | grep -e MONGODB_URI -e STRIPE_SECRET_KEY -e LINE_CHANNEL_ACCESS_TOKEN -e LINE_CHANNEL_SECRET -e SENDGRID_API_KEY -e S3_BUCKET_NAME -e S3_REGION -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY -e S3_URL -e NEXT_PUBLIC_S3_URL -e BACKUP_CRON_SECRET >> .env.production || true
        - wc -l .env.production
        - export NODE_OPTIONS=--max-old-space-size=4096
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      # - .next/cache/**/*
